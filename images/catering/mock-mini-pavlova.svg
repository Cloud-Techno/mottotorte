<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCF9F7"/><stop offset="100%" stop-color="#EEE1DA"/></linearGradient>
    <linearGradient id="meringue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#FFFBF7"/><stop offset="100%" stop-color="#F4EAE0"/></linearGradient>
    <linearGradient id="berryRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#D92B40"/><stop offset="100%" stop-color="#7B0E1B"/></linearGradient>
    <linearGradient id="goldPav" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FDE8A5"/><stop offset="100%" stop-color="#C59B35"/></linearGradient>
    <filter id="sh8" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4E3129" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="500" height="360" rx="16" fill="url(#bg8)"/>
  <ellipse cx="250" cy="305" rx="190" ry="22" fill="#583A2E" opacity="0.13"/>
  <ellipse cx="250" cy="290" rx="170" ry="17" fill="#FFFFFF" stroke="#E3D1C8" stroke-width="2"/>

  <!-- Left Mini Pavlova -->
  <g filter="url(#sh8)" transform="translate(120, 160)">
    <path d="M15,85 C5,70 12,45 28,45 C28,35 45,30 52,42 C62,32 80,40 80,55 C92,58 95,78 85,85 Z" fill="url(#meringue)" stroke="#F2E3D5" stroke-width="1.5"/>
    <!-- Cream cloud -->
    <path d="M30,55 C35,42 65,42 70,55 Z" fill="#FFFBF5"/>
    <!-- Berries -->
    <circle cx="45" cy="48" r="7.5" fill="#2E335B"/>
    <circle cx="58" cy="46" r="7.5" fill="url(#berryRed)"/>
    <circle cx="52" cy="54" r="6.5" fill="#C41C34"/>
    <path d="M52,38 Q58,32 64,36" stroke="#487834" stroke-width="2" fill="none"/>
  </g>

  <!-- Center Mini Pavlova (Grand) -->
  <g filter="url(#sh8)" transform="translate(195, 125)">
    <!-- Crispy Ruffled Base -->
    <path d="M12,110 C2,88 12,55 35,55 C36,40 60,32 72,48 C85,35 110,48 108,68 C124,72 126,100 112,110 Z" fill="url(#meringue)" stroke="#EFE0D2" stroke-width="2"/>
    <!-- Soft Mascarpone Swirl -->
    <path d="M32,68 C40,48 85,46 95,68 C100,80 90,88 80,88 C65,88 50,88 40,84 C30,84 28,76 32,68 Z" fill="#FFFDF8"/>
    <!-- Wild Raspberries, Blackberries & Redcurrant -->
    <circle cx="50" cy="58" r="11" fill="url(#berryRed)"/>
    <circle cx="72" cy="54" r="11" fill="#282E55"/>
    <circle cx="62" cy="68" r="9" fill="#9C1727"/>
    <circle cx="82" cy="68" r="8" fill="#B82236"/>
    <!-- Gold Dust & Mint -->
    <circle cx="62" cy="54" r="3.5" fill="url(#goldPav)"/>
    <path d="M60,42 C56,34 68,32 72,40 C76,32 88,36 84,44 Z" fill="#588B42"/>
  </g>

  <!-- Right Mini Pavlova (Exotic Mango & Berry) -->
  <g filter="url(#sh8)" transform="translate(295, 160)">
    <path d="M15,85 C5,70 12,45 28,45 C28,35 45,30 52,42 C62,32 80,40 80,55 C92,58 95,78 85,85 Z" fill="url(#meringue)" stroke="#F2E3D5" stroke-width="1.5"/>
    <path d="M30,55 C35,42 65,42 70,55 Z" fill="#FFFBF5"/>
    <!-- Mango slices & berries -->
    <path d="M40,48 Q55,38 68,44 Q55,54 40,48" fill="#ECA23B"/>
    <circle cx="48" cy="46" r="6.5" fill="url(#berryRed)"/>
    <circle cx="62" cy="50" r="5.5" fill="#2E335B"/>
  </g>
</svg>