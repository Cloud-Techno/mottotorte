<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCF9F6"/><stop offset="100%" stop-color="#EFE3DC"/></linearGradient>
    <linearGradient id="cheeseCream" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFDF5"/><stop offset="100%" stop-color="#F7EADB"/></linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#D79E66"/><stop offset="100%" stop-color="#9C6230"/></linearGradient>
    <linearGradient id="raspberry" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#D63A50"/><stop offset="100%" stop-color="#8E1425"/></linearGradient>
    <filter id="sh4" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#553528" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="500" height="360" rx="16" fill="url(#bg4)"/>
  <ellipse cx="250" cy="300" rx="180" ry="22" fill="#583A2E" opacity="0.13"/>
  <ellipse cx="250" cy="285" rx="160" ry="17" fill="#FFFDFD" stroke="#E4D3CA" stroke-width="2"/>

  <!-- Left Mini Cheesecake -->
  <g filter="url(#sh4)" transform="translate(125, 175)">
    <path d="M10,40 L10,75 C10,95 80,95 80,75 L80,40 Z" fill="url(#crust)"/>
    <path d="M10,40 L10,65 C10,85 80,85 80,65 L80,40 Z" fill="url(#cheeseCream)"/>
    <ellipse cx="45" cy="40" rx="35" ry="14" fill="#FFFDF8" stroke="#F0E0D0" stroke-width="1.5"/>
    <!-- Raspberry topping -->
    <path d="M25,38 C35,46 55,44 65,36 C55,30 35,32 25,38 Z" fill="url(#raspberry)"/>
    <circle cx="45" cy="33" r="5" fill="#B01C2E"/>
    <circle cx="53" cy="36" r="4" fill="#7E101E"/>
  </g>

  <!-- Center Mini Cheesecake (Tilted & Slightly Larger) -->
  <g filter="url(#sh4)" transform="translate(205, 145)">
    <path d="M10,50 L10,90 C10,115 95,115 95,90 L95,50 Z" fill="url(#crust)"/>
    <path d="M10,50 L10,78 C10,103 95,103 95,78 L95,50 Z" fill="url(#cheeseCream)"/>
    <ellipse cx="52.5" cy="50" rx="42.5" ry="17" fill="#FFFDF8" stroke="#F0E0D0" stroke-width="1.5"/>
    <!-- Swirl & Berry Composition -->
    <path d="M30,48 Q52,60 75,46 Q55,40 30,48" fill="url(#raspberry)"/>
    <circle cx="48" cy="42" r="7.5" fill="#D63A50"/>
    <circle cx="58" cy="46" r="6.5" fill="#8E1425"/>
    <path d="M52,35 Q60,30 65,36" stroke="#487834" stroke-width="2" fill="none"/>
  </g>

  <!-- Right Mini Cheesecake -->
  <g filter="url(#sh4)" transform="translate(305, 180)">
    <path d="M10,38 L10,70 C10,88 75,88 75,70 L75,38 Z" fill="url(#crust)"/>
    <path d="M10,38 L10,60 C10,78 75,78 75,60 L75,38 Z" fill="url(#cheeseCream)"/>
    <ellipse cx="42.5" cy="38" rx="32.5" ry="13" fill="#FFFDF8" stroke="#F0E0D0" stroke-width="1.5"/>
    <!-- Passionfruit swirl -->
    <ellipse cx="42" cy="38" rx="20" ry="7" fill="#ECA23B"/>
    <circle cx="38" cy="37" r="2" fill="#2E1810"/>
    <circle cx="46" cy="38" r="2" fill="#2E1810"/>
  </g>
</svg>