<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCF9F7"/><stop offset="100%" stop-color="#EEE1DA"/></linearGradient>
    <linearGradient id="tartShell" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E5AD6B"/><stop offset="100%" stop-color="#A5672E"/></linearGradient>
    <linearGradient id="custard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFDF0"/><stop offset="100%" stop-color="#FCE1A8"/></linearGradient>
    <linearGradient id="strawb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E83D4F"/><stop offset="100%" stop-color="#9C1727"/></linearGradient>
    <filter id="sh5" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#553528" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="500" height="360" rx="16" fill="url(#bg5)"/>
  <ellipse cx="250" cy="305" rx="185" ry="22" fill="#583A2E" opacity="0.13"/>
  <ellipse cx="250" cy="290" rx="165" ry="17" fill="#FFFFFF" stroke="#E3D1C8" stroke-width="2"/>

  <!-- Left Tartlet (Blueberry & Pistachio) -->
  <g filter="url(#sh5)" transform="translate(120, 175)">
    <path d="M5,35 L12,65 C15,85 85,85 88,65 L95,35 Z" fill="url(#tartShell)"/>
    <ellipse cx="50" cy="35" rx="45" ry="16" fill="url(#custard)" stroke="#C88842" stroke-width="2"/>
    <circle cx="35" cy="32" r="7.5" fill="#363C68"/>
    <circle cx="50" cy="30" r="8" fill="#2E335B"/>
    <circle cx="65" cy="33" r="7" fill="#3D4475"/>
    <circle cx="43" cy="39" r="6.5" fill="#2E335B"/>
    <circle cx="58" cy="38" r="6.5" fill="#363C68"/>
    <circle cx="52" cy="22" r="2.5" fill="#6DA645"/>
  </g>

  <!-- Center Tartlet (Strawberry & Raspberry) -->
  <g filter="url(#sh5)" transform="translate(195, 145)">
    <path d="M5,42 L14,78 C18,102 92,102 96,78 L105,42 Z" fill="url(#tartShell)"/>
    <ellipse cx="55" cy="42" rx="50" ry="18" fill="url(#custard)" stroke="#C88842" stroke-width="2.5"/>
    <!-- Fresh Strawberry fan & berries -->
    <path d="M40,25 C45,15 65,15 70,25 L55,48 Z" fill="url(#strawb)"/>
    <circle cx="36" cy="38" r="8.5" fill="#C41C34"/>
    <circle cx="74" cy="38" r="8.5" fill="#881024"/>
    <circle cx="55" cy="43" r="7" fill="#C41C34"/>
    <path d="M55,14 Q52,6 45,8" stroke="#3D7D31" stroke-width="2" fill="none"/>
  </g>

  <!-- Right Tartlet (Chocolate Ganache) -->
  <g filter="url(#sh5)" transform="translate(295, 175)">
    <path d="M5,35 L12,65 C15,85 85,85 88,65 L95,35 Z" fill="url(#tartShell)"/>
    <ellipse cx="50" cy="35" rx="45" ry="16" fill="#3B1C15" stroke="#C88842" stroke-width="2"/>
    <ellipse cx="50" cy="35" rx="41" ry="13" fill="#4E271D"/>
    <!-- Gold leaf accent -->
    <path d="M42,32 L56,28 L52,40 Z" fill="#D4AF37"/>
  </g>
</svg>