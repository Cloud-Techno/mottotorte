<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FBF8F5"/><stop offset="100%" stop-color="#EFE5DF"/></linearGradient>
    <linearGradient id="glassWall" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFF" stop-opacity="0.65"/><stop offset="25%" stop-color="#FFF" stop-opacity="0.2"/><stop offset="75%" stop-color="#FFF" stop-opacity="0.1"/><stop offset="100%" stop-color="#FFF" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="panna" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFDF7"/><stop offset="100%" stop-color="#F7EADB"/></linearGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B22234"/><stop offset="100%" stop-color="#801220"/></linearGradient>
    <linearGradient id="chocMousse" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7B4C3E"/><stop offset="100%" stop-color="#4B2A20"/></linearGradient>
    <linearGradient id="crumble" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E2B785"/><stop offset="100%" stop-color="#C2945D"/></linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4E3129" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="500" height="360" rx="16" fill="url(#bg3)"/>
  <ellipse cx="250" cy="305" rx="190" ry="22" fill="#583B32" opacity="0.14"/>
  <ellipse cx="250" cy="290" rx="175" ry="17" fill="#FFFFFF" stroke="#E3D1C8" stroke-width="2"/>

  <!-- Left Glass (Berry Panna Cotta) -->
  <g filter="url(#sh3)" transform="translate(130, 130)">
    <path d="M15,20 L25,140 A12,6 0 0,0 65,140 L75,20 Z" fill="#FFF" opacity="0.2"/>
    <path d="M24,115 L25,140 A12,6 0 0,0 65,140 L66,115 Z" fill="url(#crumble)"/>
    <path d="M21,65 L24,115 L66,115 L69,65 Z" fill="url(#panna)"/>
    <path d="M17,35 L21,65 L69,65 L73,35 Z" fill="url(#berry)"/>
    <!-- Glass border & reflection -->
    <path d="M15,20 L25,140 A12,6 0 0,0 65,140 L75,20 Z" fill="url(#glassWall)" stroke="#FFF" stroke-width="2.5"/>
    <ellipse cx="45" cy="20" rx="30" ry="6" fill="none" stroke="#FFF" stroke-width="2"/>
    <path d="M22,35 L28,125" stroke="#FFF" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <circle cx="45" cy="32" r="5" fill="#751520"/>
  </g>

  <!-- Center Glass (Mousse au Chocolat with gold spoon) -->
  <g filter="url(#sh3)" transform="translate(205, 110)">
    <path d="M15,25 L27,165 A14,7 0 0,0 73,165 L85,25 Z" fill="#FFF" opacity="0.2"/>
    <path d="M25,135 L27,165 A14,7 0 0,0 73,165 L75,135 Z" fill="url(#crumble)"/>
    <path d="M21,75 L25,135 L75,135 L79,75 Z" fill="url(#chocMousse)"/>
    <path d="M18,45 L21,75 L79,75 L82,45 Z" fill="#FFF8EE"/>
    <path d="M15,25 L27,165 A14,7 0 0,0 73,165 L85,25 Z" fill="url(#glassWall)" stroke="#FFF" stroke-width="3"/>
    <ellipse cx="50" cy="25" rx="35" ry="7" fill="none" stroke="#FFF" stroke-width="2.5"/>
    <path d="M24,40 L30,145" stroke="#FFF" stroke-width="3.5" opacity="0.7" stroke-linecap="round"/>
    <!-- Chocolate curls & gold flake -->
    <path d="M42,42 Q50,35 58,43" stroke="#3D1D15" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="38" r="3.5" fill="#D4AF37"/>
  </g>

  <!-- Right Glass (Exotic Mango Passionfruit) -->
  <g filter="url(#sh3)" transform="translate(295, 135)">
    <path d="M15,20 L25,135 A12,6 0 0,0 65,135 L75,20 Z" fill="#FFF" opacity="0.2"/>
    <path d="M23,105 L25,135 A12,6 0 0,0 65,135 L67,105 Z" fill="url(#crumble)"/>
    <path d="M20,60 L23,105 L67,105 L70,60 Z" fill="url(#panna)"/>
    <path d="M17,30 L20,60 L70,60 L73,30 Z" fill="#ECA23B"/>
    <path d="M15,20 L25,135 A12,6 0 0,0 65,135 L75,20 Z" fill="url(#glassWall)" stroke="#FFF" stroke-width="2.5"/>
    <ellipse cx="45" cy="20" rx="30" ry="6" fill="none" stroke="#FFF" stroke-width="2"/>
    <path d="M22,35 L28,120" stroke="#FFF" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <circle cx="45" cy="28" r="4" fill="#C43B3B"/>
  </g>
</svg>