<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCF9F7"/><stop offset="100%" stop-color="#F2E6E2"/></linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EED5B7"/><stop offset="100%" stop-color="#C89A6B"/></linearGradient>
    <linearGradient id="frost1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFF8F5"/><stop offset="60%" stop-color="#F5DDD9"/><stop offset="100%" stop-color="#DDA0A0"/></linearGradient>
    <linearGradient id="frost2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFDF9"/><stop offset="100%" stop-color="#ECD4BA"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F9E298"/><stop offset="100%" stop-color="#C59B35"/></linearGradient>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#553028" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="500" height="360" rx="16" fill="url(#bg1)"/>
  <ellipse cx="250" cy="305" rx="190" ry="24" fill="#6A463B" opacity="0.12"/>
  <ellipse cx="250" cy="290" rx="170" ry="18" fill="#FFFDFD" stroke="#E6D3CB" stroke-width="2"/>
  
  <!-- Left Mini Cupcake -->
  <g filter="url(#sh1)" transform="translate(130, 140)">
    <path d="M25,80 L35,130 L85,130 L95,80 Z" fill="url(#cup)"/>
    <path d="M25,80 L30,130 M42,80 L45,130 M60,80 L60,130 M78,80 L75,130 M95,80 L90,130" stroke="#B07C50" stroke-width="1.5" opacity="0.4"/>
    <path d="M18,80 C15,60 40,55 50,65 C60,45 90,50 95,70 C105,75 105,85 95,90 C85,95 25,95 18,80 Z" fill="url(#frost2)"/>
    <path d="M30,65 C35,45 60,40 68,52 C75,40 92,48 88,65 Z" fill="#FFFBF5"/>
    <circle cx="60" cy="40" r="7" fill="url(#gold)"/>
  </g>
  
  <!-- Center Star Cupcake (with Corporate Logo Badge) -->
  <g filter="url(#sh1)" transform="translate(195, 110)">
    <path d="M25,95 L37,155 L93,155 L105,95 Z" fill="url(#cup)"/>
    <path d="M25,95 L32,155 M45,95 L48,155 M65,95 L65,155 M85,95 L82,155 M105,95 L98,155" stroke="#B07C50" stroke-width="1.5" opacity="0.4"/>
    <path d="M15,95 C10,70 40,65 55,75 C65,50 100,55 110,80 C120,90 115,105 100,110 C85,115 25,115 15,95 Z" fill="url(#frost1)"/>
    <path d="M30,75 C35,50 65,45 75,60 C85,45 105,55 100,75 Z" fill="#FFF0ED"/>
    <path d="M48,55 C52,38 78,38 82,55 Z" fill="#FDE1DC"/>
    <!-- Logo Disc -->
    <circle cx="65" cy="36" r="16" fill="#FFFFFF" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M57,36 L65,28 L73,36 L65,44 Z" fill="url(#gold)"/>
  </g>

  <!-- Right Mini Cupcake -->
  <g filter="url(#sh1)" transform="translate(285, 145)">
    <path d="M22,75 L32,125 L80,125 L90,75 Z" fill="url(#cup)"/>
    <path d="M18,75 C15,55 38,50 48,60 C58,40 85,45 90,65 C98,72 96,82 88,86 C78,92 24,90 18,75 Z" fill="url(#frost1)"/>
    <circle cx="56" cy="42" r="6" fill="#D36B73"/>
    <circle cx="70" cy="48" r="4.5" fill="url(#gold)"/>
  </g>
</svg>