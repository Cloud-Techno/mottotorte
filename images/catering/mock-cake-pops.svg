<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCF9F7"/><stop offset="100%" stop-color="#EDE0D8"/></linearGradient>
    <linearGradient id="popWhite" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EEDDD8"/></linearGradient>
    <linearGradient id="popRose" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F2D2CD"/><stop offset="100%" stop-color="#C57D84"/></linearGradient>
    <linearGradient id="popGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FDE8A5"/><stop offset="100%" stop-color="#C59B35"/></linearGradient>
    <filter id="sh7" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4C2D26" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="500" height="360" rx="16" fill="url(#bg7)"/>
  <ellipse cx="250" cy="310" rx="180" ry="20" fill="#583A2E" opacity="0.13"/>
  <rect x="110" y="275" width="280" height="30" rx="10" fill="#FFFDFD" stroke="#E2D0C6" stroke-width="2"/>

  <!-- Left Cake Pop (White with Gold Drizzle) -->
  <g filter="url(#sh7)" transform="translate(140, 75)">
    <!-- Stick -->
    <line x1="45" y1="45" x2="45" y2="200" stroke="#EFE4DC" stroke-width="6" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="38" fill="url(#popWhite)"/>
    <!-- Gold Drizzle -->
    <path d="M22,35 Q45,22 68,32 Q50,48 30,55 Q60,60 68,48" stroke="url(#popGold)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Little bow on stick -->
    <path d="M35,88 C25,82 25,94 35,90 L45,88 L55,90 C65,94 65,82 55,88 Z" fill="#DDA0A0"/>
  </g>

  <!-- Center Cake Pop (Dusty Rose with Edible Pearls - Elevated) -->
  <g filter="url(#sh7)" transform="translate(205, 50)">
    <!-- Stick -->
    <line x1="45" y1="45" x2="45" y2="225" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="42" fill="url(#popRose)"/>
    <!-- Shimmer & Pearls -->
    <ellipse cx="32" cy="30" rx="12" ry="7" fill="#FFF" opacity="0.45" transform="rotate(-30 32 30)"/>
    <circle cx="58" cy="32" r="3.5" fill="#FFF"/>
    <circle cx="65" cy="48" r="3" fill="url(#popGold)"/>
    <circle cx="45" cy="62" r="3.5" fill="#FFF"/>
    <circle cx="30" cy="52" r="2.8" fill="url(#popGold)"/>
    <circle cx="50" cy="22" r="2.5" fill="#FFF"/>
    <!-- Silk ribbon on stick -->
    <path d="M30,96 C18,88 18,104 32,98 L45,95 L58,98 C72,104 72,88 60,96 Z" fill="url(#popGold)"/>
  </g>

  <!-- Right Cake Pop (Milk Chocolate & Gold Flakes) -->
  <g filter="url(#sh7)" transform="translate(275, 75)">
    <!-- Stick -->
    <line x1="45" y1="45" x2="45" y2="200" stroke="#EFE4DC" stroke-width="6" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="38" fill="#58352A"/>
    <ellipse cx="32" cy="32" rx="10" ry="6" fill="#FFF" opacity="0.25" transform="rotate(-30 32 32)"/>
    <!-- Gold leaf flakes -->
    <polygon points="40,30 48,26 44,36" fill="url(#popGold)"/>
    <polygon points="58,45 66,42 62,50" fill="url(#popGold)"/>
    <polygon points="32,50 38,46 36,54" fill="url(#popGold)"/>
    <!-- Little bow on stick -->
    <path d="M35,88 C25,82 25,94 35,90 L45,88 L55,90 C65,94 65,82 55,88 Z" fill="#B27C7C"/>
  </g>
</svg>