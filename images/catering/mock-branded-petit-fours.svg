<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCF9F7"/><stop offset="100%" stop-color="#EEE2DC"/></linearGradient>
    <linearGradient id="glazeWhite" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFDFD"/><stop offset="100%" stop-color="#F2E6E2"/></linearGradient>
    <linearGradient id="glazeRose" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F5DDD9"/><stop offset="100%" stop-color="#DDA0A0"/></linearGradient>
    <linearGradient id="sideDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D5B0A6"/><stop offset="100%" stop-color="#A57B71"/></linearGradient>
    <linearGradient id="goldPf" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCEAB3"/><stop offset="100%" stop-color="#C59B35"/></linearGradient>
    <filter id="sh6" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#4E2B25" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="500" height="360" rx="16" fill="url(#bg6)"/>
  <ellipse cx="250" cy="305" rx="190" ry="22" fill="#583A2E" opacity="0.13"/>
  <rect x="85" y="275" width="330" height="25" rx="8" fill="#F7ECE4" stroke="#DECBC2" stroke-width="2"/>

  <!-- Left Petit Four (Blush Pink Cube) -->
  <g filter="url(#sh6)" transform="translate(115, 175)">
    <polygon points="10,40 60,15 105,40 55,65" fill="url(#glazeRose)"/>
    <polygon points="10,40 55,65 55,105 10,80" fill="url(#sideDark)"/>
    <polygon points="55,65 105,40 105,80 55,105" fill="#B78E84"/>
    <circle cx="58" cy="40" r="10" fill="#FFF" opacity="0.8"/>
    <!-- Logo Monogram -->
    <text x="58" y="44" font-family="'Playfair Display', serif" font-size="12" font-weight="700" fill="#935F5F" text-anchor="middle">M</text>
  </g>

  <!-- Center Petit Four (Branded with Corporate Crest & Gold) -->
  <g filter="url(#sh6)" transform="translate(195, 140)">
    <polygon points="12,48 72,16 122,48 62,80" fill="url(#glazeWhite)"/>
    <polygon points="12,48 62,80 62,130 12,98" fill="#DCC7C0"/>
    <polygon points="62,80 122,48 122,98 62,130" fill="#BFA39B"/>
    <!-- Printed Edible Logo Plaque -->
    <g transform="translate(67, 48)">
      <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#FFFFFF" stroke="url(#goldPf)" stroke-width="2"/>
      <circle cx="-18" cy="0" r="7" fill="url(#goldPf)"/>
      <path d="-18,-5 L-15,3 L-21,3 Z" fill="#FFF"/>
      <!-- Brand lines -->
      <line x1="-5" y1="-5" x2="25" y2="-5" stroke="#716766" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-5" y1="4" x2="16" y2="4" stroke="#935F5F" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Little sugar pearl -->
    <circle cx="112" cy="44" r="3.5" fill="url(#goldPf)"/>
  </g>

  <!-- Right Petit Four (Chocolate/Mocha with Gold Monogram) -->
  <g filter="url(#sh6)" transform="translate(295, 175)">
    <polygon points="10,40 60,15 105,40 55,65" fill="#4B271F"/>
    <polygon points="10,40 55,65 55,105 10,80" fill="#321610"/>
    <polygon points="55,65 105,40 105,80 55,105" fill="#240D07"/>
    <!-- Gold Piping lines -->
    <path d="M25,35 Q55,48 90,30" stroke="url(#goldPf)" stroke-width="2.5" fill="none"/>
    <circle cx="55" cy="40" r="4" fill="url(#goldPf)"/>
  </g>
</svg>